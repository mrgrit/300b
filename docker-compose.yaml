# =========================================================
# 300B 실습 환경 — 4-tier (AWS-style) 단일 VM 통합 compose
# =========================================================
# 컨테이너 구성 (총 17개):
#   Edge        : 300b-fw                  (nftables DNAT + dnsmasq)
#   DMZ         : 300b-waf                 (Apache + ModSecurity reverse proxy)
#   IDS sidecar : 300b-ids                 (Suricata IDS)
#   Private     : juiceshop / dvwa /
#                 neobank / govportal /
#                 mediforum / adminconsole /
#                 aicompanion              (외부 포트 노출 ❌)
#   Mgmt        : 300b-secu / 300b-siem /
#                 300b-bastion / 300b-attacker
#   Wazuh       : wazuh-manager /
#                 wazuh-indexer /
#                 wazuh-dashboard
#
# 네트워크 (4 + Wazuh 1):
#   300b-edge    172.30.10.0/24   public-facing  (fw, ids 만)
#   300b-dmz     172.30.20.0/24   fw ↔ waf       (fw, waf, ids)
#   300b-private 172.30.30.0/24   vuln backends   (Phase B 에서 internal: true 적용 예정)
#   300b-mgmt    172.30.40.0/24   ops 망          (secu, siem, bastion, attacker, waf, wazuh-*)
#
# 외부 노출 host port (단 2종):
#   80,443   → 300b-fw  (HTTPS 는 Phase C 에서 활성)
#   2204     → 300b-bastion  (SSH jumphost)
#   8003     → 300b-bastion  (Bastion API — Phase 후속에서 waf 경유로 통합 가능)
# ---------------------------------------------------------

x-common: &common-restart
  restart: unless-stopped

services:

  # ============================================
  # Edge tier
  # ============================================
  300b-fw:
    build:
      context: .
      dockerfile: fw/Dockerfile
    image: 300b/fw:standalone
    container_name: 300b-fw
    hostname: 300b-fw
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      ENABLE_DNSMASQ: ${ENABLE_DNSMASQ:-false}      # Phase D 에서 true
      HOST_IP: ${VM_IP:-}                            # dnsmasq 가 응답할 VM 외부 IP (300b.sh 자동 주입)
    extra_hosts:
      - "host.docker.internal:host-gateway"          # HOST_IP 미지정 시 fallback
    networks:
      300b-edge:
        ipv4_address: 172.30.10.10
      300b-dmz:
        ipv4_address: 172.30.20.10
      300b-mgmt:
        # 정적 할당 X — 다른 mgmt 컨테이너가 먼저 떠서 IP 점유 가능. 동적으로.
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
      # DNS 53 은 VM 외부 IP 에만 bind — systemd-resolved 의 127.0.0.53 과 충돌 회피.
      # VM_IP 가 .env 에 비어 있으면 (init 전) docker 가 fail. 300b.sh ensure_env 가 자동 설정.
      - "${VM_IP:-127.0.0.1}:53:53/udp"
      - "${VM_IP:-127.0.0.1}:53:53/tcp"
    depends_on:
      - 300b-waf
    <<: *common-restart

  # ============================================
  # DMZ tier — WAF (Apache + ModSecurity reverse proxy)
  # ============================================
  300b-waf:
    build:
      context: .
      dockerfile: waf/Dockerfile
    image: 300b/waf:standalone
    container_name: 300b-waf
    hostname: 300b-waf
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      ENABLE_TLS: ${ENABLE_TLS:-false}              # Phase C 에서 true
    volumes:
      - waf-logs:/var/log/apache2                   # portal 가 read-only 로 마운트
    networks:
      300b-dmz:
        ipv4_address: 172.30.20.20
      300b-private:
        # 동적 할당 (fw entrypoint 가 docker DNS 로 해석)
      300b-mgmt:
        # 동적 할당
    <<: *common-restart

  # ============================================
  # IDS sidecar (passive sniff on dmz)
  # ============================================
  300b-ids:
    build:
      context: .
      dockerfile: ids/Dockerfile
    image: 300b/ids:standalone
    container_name: 300b-ids
    hostname: 300b-ids
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      SURICATA_IFACE: ${SURICATA_IFACE:-eth0}
    volumes:
      - ids-logs:/var/log/suricata                  # portal 가 read-only 로 마운트
    networks: [300b-dmz, 300b-mgmt]
    <<: *common-restart

  # ============================================
  # Mgmt tier — security ops
  # ============================================
  300b-secu:
    build:
      context: .
      dockerfile: secu/Dockerfile
    image: 300b/secu:standalone
    container_name: 300b-secu
    hostname: 300b-secu
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
    networks: [300b-mgmt]
    <<: *common-restart

  300b-siem:
    build:
      context: .
      dockerfile: siem/Dockerfile
    image: 300b/siem:standalone
    container_name: 300b-siem
    hostname: 300b-siem
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_SUBAGENT_MODEL: ${LLM_SUBAGENT_MODEL:-gemma3:4b}
      LLM_MANAGER_MODEL: ${LLM_MANAGER_MODEL:-gpt-oss:120b}
    volumes:
      - 300b-cti-data:/opt/app/contents/threats
    networks: [300b-mgmt]
    <<: *common-restart

  300b-bastion:
    build:
      context: .
      dockerfile: bastion/Dockerfile
    image: 300b/bastion:standalone
    container_name: 300b-bastion
    hostname: 300b-bastion
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MANAGER_MODEL: ${LLM_MANAGER_MODEL:-gpt-oss:120b}
      LLM_SUBAGENT_MODEL: ${LLM_SUBAGENT_MODEL:-gemma3:4b}
      API_KEY: ${API_KEY:-300b-api-key-2026}
      JWT_SECRET: ${JWT_SECRET:-300b-jwt-secret-2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - 300b-bastion-data:/opt/app/data
      - 300b-bastion-playbooks:/opt/app/contents/playbooks
    networks: [300b-mgmt]
    ports:
      - "${SSH_PORT_BASTION:-2204}:22"
      - "${PORT_BASTION_API:-8003}:8003"
    <<: *common-restart

  300b-attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    image: 300b/attacker:standalone
    container_name: 300b-attacker
    hostname: 300b-attacker
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
    networks: [300b-mgmt, 300b-private]
    <<: *common-restart

  # ============================================
  # Portal — AWS Console 풍 운영 대시보드 (mgmt 망에만)
  # ============================================
  300b-portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: 300b/portal:standalone
    container_name: 300b-portal
    hostname: 300b-portal
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      API_KEY: ${API_KEY:-300b-api-key-2026}
    volumes:
      # docker socket 읽기전용 — 컨테이너/네트워크 조회용. 침해 시 권한 상승 위험 ⚠️
      # (학습 환경 trade-off; production 에서는 별도 RBAC 필요)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # waf, ids 의 로그 디렉토리 마운트 (read-only) — modsec_audit + eve.json 표시
      - waf-logs:/portal-data/waf-logs:ro
      - ids-logs:/portal-data/ids-logs:ro
    networks: [300b-mgmt]
    <<: *common-restart

  # ============================================
  # Wazuh single-node (mgmt 망)
  # ============================================
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.10.0
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-certs/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh-certs/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh-certs/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh-certs/certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh-certs/certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh-certs/wazuh_indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh-certs/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      300b-mgmt:
        aliases: [wazuh.indexer, wazuh-indexer]
    <<: *common-restart

  wazuh-manager:
    image: wazuh/wazuh-manager:4.10.0
    container_name: wazuh-manager
    hostname: wazuh.manager
    depends_on: [wazuh-indexer]
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      - wazuh-manager-var:/var/ossec/var
      - ./wazuh-certs/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh-certs/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh-certs/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
    networks:
      300b-mgmt:
        aliases: [wazuh.manager, wazuh-manager]
    # 1514/agent, 1515/registration 은 mgmt 내부에서만 접근. 514/syslog 도 내부.
    <<: *common-restart

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.10.0
    container_name: wazuh-dashboard
    hostname: wazuh.dashboard
    depends_on: [wazuh-indexer, wazuh-manager]
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - ./wazuh-certs/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh-certs/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh-certs/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-certs/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh-certs/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    networks:
      300b-mgmt:
        aliases: [wazuh.dashboard, wazuh-dashboard]
    # Dashboard 도 외부 포트 노출 X. waf 의 wazuh.300b.lab vhost 만으로 접근.
    <<: *common-restart

  # ============================================
  # Private tier — vuln backends (외부 포트 노출 ❌)
  # ============================================
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    hostname: juiceshop
    networks: [300b-private]
    <<: *common-restart

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    hostname: dvwa
    networks: [300b-private]
    <<: *common-restart

  neobank:
    build: src/contents/vuln-sites/neobank
    image: neobank:vulnerable
    container_name: neobank
    hostname: neobank
    networks: [300b-private]
    <<: *common-restart

  govportal:
    build: src/contents/vuln-sites/govportal
    image: govportal:vulnerable
    container_name: govportal
    hostname: govportal
    networks: [300b-private]
    <<: *common-restart

  mediforum:
    build: src/contents/vuln-sites/mediforum
    image: mediforum:vulnerable
    container_name: mediforum
    hostname: mediforum
    networks: [300b-private]
    <<: *common-restart

  adminconsole:
    build: src/contents/vuln-sites/adminconsole
    image: adminconsole:vulnerable
    container_name: adminconsole
    hostname: adminconsole
    networks: [300b-private]
    <<: *common-restart

  aicompanion:
    build: src/contents/vuln-sites/aicompanion
    image: aicompanion:vulnerable
    container_name: aicompanion
    hostname: aicompanion
    environment:
      LLM_BACKEND: ${AICOMPANION_LLM_BACKEND:-mock}
      OLLAMA_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${LLM_SUBAGENT_MODEL:-gemma3:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # AICompanion 은 LLM 외부 GPU 서버로 outbound 필요 → mgmt 망에도 join.
    # Phase B 에서 private 가 internal: true 가 되어도 이 dual-NIC 가 LLM 경로 보존.
    networks: [300b-private, 300b-mgmt]
    <<: *common-restart

# ============================================
# Networks
# ============================================
networks:
  300b-edge:
    name: 300b-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  300b-dmz:
    name: 300b-dmz
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24
  300b-private:
    name: 300b-private
    driver: bridge
    internal: true   # Phase B: outbound NAT 없음 — vuln 사이트 침해 후 외부 C2/exfil 차단.
    ipam:
      config:
        - subnet: 172.30.30.0/24
  300b-mgmt:
    name: 300b-mgmt
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.40.0/24

volumes:
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:
  wazuh-manager-var:
  300b-bastion-data:
  300b-bastion-playbooks:
  300b-cti-data:
  waf-logs:
  ids-logs:
