<VirtualHost *:443>
    ServerName 300b.lab
    ServerAlias localhost 300b
    DocumentRoot /var/www/landing
    DirectoryIndex index.html
    <Directory /var/www/landing>
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/landing.crt
    SSLCertificateKeyFile   /etc/ssl/300b/landing.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/landing-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/landing-tls-access.log combined
</VirtualHost>
