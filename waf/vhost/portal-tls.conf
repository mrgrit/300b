<VirtualHost *:443>
    ServerName portal.300b.lab
    ServerAlias portal

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://300b-portal:8005/ upgrade=websocket
    ProxyPassReverse / http://300b-portal:8005/

    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/portal.crt
    SSLCertificateKeyFile   /etc/ssl/300b/portal.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/portal-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-tls-access.log combined
</VirtualHost>
