# Wazuh Dashboard — HTTPS upstream. wazuh.300b.lab → wazuh-dashboard:5601 (TLS)
<VirtualHost *:80>
    ServerName wazuh.300b.lab
    ServerAlias wazuh siem.300b.lab

    # Wazuh dashboard 는 자체 self-signed TLS 사용 (5601). proxy 가 검증 skip.
    SSLProxyEngine On
    SSLProxyVerify None
    SSLProxyCheckPeerCN Off
    SSLProxyCheckPeerName Off
    SSLProxyCheckPeerExpire Off

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket (kibana_socket 등)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) wss://wazuh-dashboard:5601/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) https://wazuh-dashboard:5601/$1 [P,L]

    ProxyPass        / https://wazuh-dashboard:5601/
    ProxyPassReverse / https://wazuh-dashboard:5601/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/wazuh-error.log
    CustomLog ${APACHE_LOG_DIR}/wazuh-access.log combined
</VirtualHost>
