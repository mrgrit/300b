<VirtualHost *:443>
    ServerName neobank.300b.lab
    ServerAlias neobank

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://neobank:3001/ upgrade=websocket
    ProxyPassReverse / http://neobank:3001/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/neobank.crt
    SSLCertificateKeyFile   /etc/ssl/300b/neobank.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/neobank-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/neobank-tls-access.log combined
</VirtualHost>
