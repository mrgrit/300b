<VirtualHost *:443>
    ServerName dvwa.300b.lab
    ServerAlias dvwa

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://dvwa:80/ upgrade=websocket
    ProxyPassReverse / http://dvwa:80/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/dvwa.crt
    SSLCertificateKeyFile   /etc/ssl/300b/dvwa.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/dvwa-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/dvwa-tls-access.log combined
</VirtualHost>
