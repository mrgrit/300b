# 300B Landing — 도메인 미지정 시 (Host 헤더 없음 또는 매칭 안 됨) 표시되는 인덱스.
<VirtualHost *:80>
    ServerName 300b.lab
    ServerAlias 300b.lab localhost
    DocumentRoot /var/www/landing
    DirectoryIndex index.html

    <Directory /var/www/landing>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/landing-error.log
    CustomLog ${APACHE_LOG_DIR}/landing-access.log combined
</VirtualHost>
