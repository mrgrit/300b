# MediForum — Flask. mediforum.300b.lab → mediforum:3003
<VirtualHost *:80>
    ServerName mediforum.300b.lab
    ServerAlias mediforum forum.300b.lab

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://mediforum:3003/
    ProxyPassReverse / http://mediforum:3003/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/mediforum-error.log
    CustomLog ${APACHE_LOG_DIR}/mediforum-access.log combined
</VirtualHost>
