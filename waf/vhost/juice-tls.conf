<VirtualHost *:443>
    ServerName juice.300b.lab
    ServerAlias juice

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://juiceshop:3000/ upgrade=websocket
    ProxyPassReverse / http://juiceshop:3000/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/juice.crt
    SSLCertificateKeyFile   /etc/ssl/300b/juice.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/juice-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/juice-tls-access.log combined
</VirtualHost>
