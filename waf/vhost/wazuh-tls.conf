<VirtualHost *:443>
    ServerName wazuh.300b.lab
    ServerAlias wazuh

    SSLProxyEngine On
    SSLProxyVerify None
    SSLProxyCheckPeerCN Off
    SSLProxyCheckPeerName Off
    SSLProxyCheckPeerExpire Off

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / https://wazuh-dashboard:5601/ upgrade=websocket
    ProxyPassReverse / https://wazuh-dashboard:5601/

    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/wazuh.crt
    SSLCertificateKeyFile   /etc/ssl/300b/wazuh.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/wazuh-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/wazuh-tls-access.log combined
</VirtualHost>
