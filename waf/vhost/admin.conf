# AdminConsole — Flask. admin.300b.lab → adminconsole:3004
<VirtualHost *:80>
    ServerName admin.300b.lab
    ServerAlias adminconsole adminconsole.300b.lab

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://adminconsole:3004/
    ProxyPassReverse / http://adminconsole:3004/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/admin-error.log
    CustomLog ${APACHE_LOG_DIR}/admin-access.log combined
</VirtualHost>
