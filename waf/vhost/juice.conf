# Juice Shop — Node SPA + WebSocket. juice.300b.lab → juiceshop:3000
<VirtualHost *:80>
    ServerName juice.300b.lab
    ServerAlias juice juiceshop.300b.lab

    ProxyPreserveHost On
    ProxyRequests Off
    # WebSocket 업그레이드 처리.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://juiceshop:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://juiceshop:3000/$1 [P,L]

    ProxyPass        / http://juiceshop:3000/
    ProxyPassReverse / http://juiceshop:3000/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/juice-error.log
    CustomLog ${APACHE_LOG_DIR}/juice-access.log combined
</VirtualHost>
