<VirtualHost *:443>
    ServerName mediforum.300b.lab
    ServerAlias mediforum

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://mediforum:3003/ upgrade=websocket
    ProxyPassReverse / http://mediforum:3003/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/mediforum.crt
    SSLCertificateKeyFile   /etc/ssl/300b/mediforum.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/mediforum-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/mediforum-tls-access.log combined
</VirtualHost>
