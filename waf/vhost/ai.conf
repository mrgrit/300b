# AICompanion — Flask + LLM. ai.300b.lab → aicompanion:3005
<VirtualHost *:80>
    ServerName ai.300b.lab
    ServerAlias aicompanion ai

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://aicompanion:3005/
    ProxyPassReverse / http://aicompanion:3005/

    # LLM 응답이 길 수 있어 timeout 늘림.
    ProxyTimeout 600

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/ai-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-access.log combined
</VirtualHost>
