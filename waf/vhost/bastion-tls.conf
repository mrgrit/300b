<VirtualHost *:443>
    ServerName bastion.300b.lab
    ServerAlias bastion

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://300b-bastion:8003/ upgrade=websocket
    ProxyPassReverse / http://300b-bastion:8003/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/bastion.crt
    SSLCertificateKeyFile   /etc/ssl/300b/bastion.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/bastion-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/bastion-tls-access.log combined
</VirtualHost>
