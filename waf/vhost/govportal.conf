# GovPortal — Flask. govportal.300b.lab → govportal:3002
<VirtualHost *:80>
    ServerName govportal.300b.lab
    ServerAlias govportal gov.300b.lab

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://govportal:3002/
    ProxyPassReverse / http://govportal:3002/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/govportal-error.log
    CustomLog ${APACHE_LOG_DIR}/govportal-access.log combined
</VirtualHost>
