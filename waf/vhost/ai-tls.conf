<VirtualHost *:443>
    ServerName ai.300b.lab
    ServerAlias ai

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://aicompanion:3005/ upgrade=websocket
    ProxyPassReverse / http://aicompanion:3005/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/ai.crt
    SSLCertificateKeyFile   /etc/ssl/300b/ai.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/ai-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-tls-access.log combined
</VirtualHost>
