<VirtualHost *:443>
    ServerName admin.300b.lab
    ServerAlias admin

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://adminconsole:3004/ upgrade=websocket
    ProxyPassReverse / http://adminconsole:3004/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/admin.crt
    SSLCertificateKeyFile   /etc/ssl/300b/admin.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/admin-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/admin-tls-access.log combined
</VirtualHost>
