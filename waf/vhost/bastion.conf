# Bastion API — uvicorn HTTP. bastion.300b.lab → 300b-bastion:8003
<VirtualHost *:80>
    ServerName bastion.300b.lab
    ServerAlias bastion ops.300b.lab

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://300b-bastion:8003/
    ProxyPassReverse / http://300b-bastion:8003/

    # WebSocket (chat stream — bastion 의 SSE/streaming 가능성)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://300b-bastion:8003/$1 [P,L]

    # SSE (text/event-stream) — buffering off.
    SetEnv proxy-sendcl 1

    ProxyTimeout 600

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/bastion-error.log
    CustomLog ${APACHE_LOG_DIR}/bastion-access.log combined
</VirtualHost>
