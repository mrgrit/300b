<VirtualHost *:443>
    ServerName govportal.300b.lab
    ServerAlias govportal

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://govportal:3002/ upgrade=websocket
    ProxyPassReverse / http://govportal:3002/

    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/ssl/300b/govportal.crt
    SSLCertificateKeyFile   /etc/ssl/300b/govportal.key
    SSLCertificateChainFile /etc/ssl/300b/ca.pem

    ErrorLog ${APACHE_LOG_DIR}/govportal-tls-error.log
    CustomLog ${APACHE_LOG_DIR}/govportal-tls-access.log combined
</VirtualHost>
