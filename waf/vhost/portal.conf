# 300B Portal — AWS Console 풍 운영 대시보드. portal.300b.lab → 300b-portal:8005
<VirtualHost *:80>
    ServerName portal.300b.lab
    ServerAlias portal

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://300b-portal:8005/ upgrade=websocket
    ProxyPassReverse / http://300b-portal:8005/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/portal-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-access.log combined
</VirtualHost>
